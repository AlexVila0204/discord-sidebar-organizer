<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidebar Organizer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="title-row">
        <svg class="logo-diamond" viewBox="0 0 24 24" width="18" height="18">
          <path d="M12 2L22 12L12 22L2 12Z" fill="url(#grad)" />
          <defs>
            <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#7C6AFF" />
              <stop offset="100%" stop-color="#5865F2" />
            </linearGradient>
          </defs>
        </svg>
        <h1>Sidebar Organizer</h1>
      </div>
      <div id="status-pill" class="status-pill disconnected">
        <span class="status-dot"></span>
        <span id="status-text">Disconnected</span>
      </div>
    </header>

    <main class="popup-body">
      <div class="glass-card" id="status-card">
        <div class="card-icon" id="card-icon">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
        </div>
        <p class="card-message" id="card-message">Waiting for MCP bridge</p>
        <p class="card-sub" id="card-sub">Start Claude or Gemini with the MCP server</p>
      </div>

      <button id="action-btn" class="action-btn">
        <span id="action-text">Check Connection</span>
      </button>

      <div class="setup-section" id="setup-section">
        <button class="setup-toggle" id="setup-toggle">
          <span>Setup commands</span>
          <svg class="chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9" />
          </svg>
        </button>
        <div class="setup-content" id="setup-content">
          <div class="cmd-row">
            <span class="cmd-label">Claude</span>
            <div class="cmd-box">
              <code>claude mcp add --scope user discord -- npx discord-ai-organizer</code>
              <button class="copy-btn" data-copy="claude mcp add --scope user discord -- npx discord-ai-organizer">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              </button>
            </div>
          </div>
          <div class="cmd-row">
            <span class="cmd-label">Gemini</span>
            <div class="cmd-box">
              <code>gemini mcp add discord -- npx discord-ai-organizer</code>
              <button class="copy-btn" data-copy="gemini mcp add discord -- npx discord-ai-organizer">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                  <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="popup-footer">
      <a href="https://github.com/AlexVila0204" target="_blank" rel="noopener">AlexVila0204</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
